name: Pages alpha portal

# Publishes the debug APK and its download portal to GitHub Pages (SMO-S3-05).
# Runs on `main` (after the sprint PR lands) and on version tags; `workflow_dispatch` exists so a
# maintainer can redeploy without an empty commit.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer commit supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Test, assemble and render portal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Wrapper validation + dependency cache; the version comes from gradle/wrapper.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Stage APK and render portal
        env:
          # Tags publish their own name; branch builds get `alpha-<short sha>` from the script.
          VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          COMMIT: ${{ github.sha }}
          PAGES_URL: https://smoh-apps.github.io/ShowMeOutfit/
        run: |
          mkdir -p public
          cp app/build/outputs/apk/debug/app-debug.apk public/showmeoutfit-alpha.apk
          node scripts/render-portal.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
