name: Android CI

on:
  push:
    branches:
      - main
      - "sprint-*"
      - "feature/**"
  pull_request:
    branches:
      - main
      - "sprint-*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Domain purity guard
        run: |
          if grep -rnE '^import (android|androidx)\.' app/src/main/java/com/smoh/showmeoutfit/domain; then
            echo "::error::domain/ must not import android.* or androidx.*"
            exit 1
          fi
          echo "Domain layer is framework-free."

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --console=plain --stacktrace

      - name: Lint
        run: ./gradlew lintDebug --console=plain --stacktrace

      - name: Compile instrumented tests
        run: ./gradlew compileDebugAndroidTestKotlin --console=plain --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          if-no-files-found: ignore
          retention-days: 7
          path: |
            app/build/reports/**
            app/build/test-results/**
