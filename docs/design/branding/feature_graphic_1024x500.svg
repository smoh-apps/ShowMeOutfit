<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <style>
      .bg { fill: #F8F7F4; }
      .brand-title { font-family: 'Segoe UI', Roboto, sans-serif; font-size: 52px; font-weight: 800; fill: #111827; letter-spacing: -1px; }
      .brand-subtitle { font-family: 'Segoe UI', Roboto, sans-serif; font-size: 22px; font-weight: 500; fill: #4B5563; }
      .pill-bg { fill: #EDE8E1; rx: 16px; ry: 16px; }
      .pill-text { font-family: 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 600; fill: #1F2937; }
      .stroke-main { fill: none; stroke: #111827; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-tail { fill: none; stroke: #111827; stroke-width: 13; stroke-linecap: round; stroke-linejoin: round; }
      .sun { fill: #E06D44; }
      .sun-glow { fill: #E06D44; opacity: 0.15; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect class="bg" width="1024" height="500" />

  <!-- Subtle Weather Orbit Curves in Background -->
  <circle cx="280" cy="250" r="230" fill="none" stroke="#E5E0D8" stroke-width="2" stroke-dasharray="6,8" />
  <circle cx="280" cy="250" r="190" fill="none" stroke="#ECE7DF" stroke-width="1.5" />

  <!-- LEFT: S-M-O Brand Emblem (Scaled & Centered around x=280, y=250) -->
  <g transform="translate(90, 60) scale(0.74)">
    <!-- Outer Orbit Ring: 'O' -->
    <circle class="stroke-main" cx="256" cy="256" r="172" />
    
    <!-- Sun Glow & Sun Dot -->
    <circle class="sun-glow" cx="256" cy="184" r="32" />
    <circle class="sun" cx="256" cy="184" r="16" />

    <!-- Coat Hanger Hook -->
    <path class="stroke-main" d="M 256 160 C 256 138, 274 134, 274 146 C 274 156, 262 162, 256 172" />

    <!-- Coat Hanger Shoulders & Lapels: 'M' -->
    <path class="stroke-main" d="M 256 172 L 132 242 C 124 246, 126 256, 136 256 L 176 256 L 176 338" />
    <path class="stroke-main" d="M 256 172 L 380 242 C 388 246, 386 256, 376 256 L 336 256 L 336 338" />
    <path class="stroke-main" d="M 176 256 L 216 288 L 256 256 L 296 288 L 336 256" />

    <!-- Cat-Tail 'S' -->
    <path class="stroke-tail" d="M 224 232 C 196 238, 188 274, 226 296 C 276 324, 284 356, 256 386 C 230 412, 186 398, 178 368 C 174 354, 184 340, 196 342 C 206 344, 210 356, 214 366 C 222 384, 248 388, 262 374 C 278 358, 268 334, 236 316 C 188 290, 186 244, 224 224" />
  </g>

  <!-- RIGHT: Typography & Feature Highlights -->
  <g transform="translate(520, 140)">
    <!-- App Name -->
    <text class="brand-title" x="0" y="40">ShowMeOutfit</text>
    
    <!-- Subtitle -->
    <text class="brand-subtitle" x="0" y="85">Diurnal Weather &amp; Layering Intelligence</text>

    <!-- Divider Line -->
    <line x1="0" y1="115" x2="420" y2="115" stroke="#E0D9CE" stroke-width="1.5" />

    <!-- Feature Badge Pills -->
    <g transform="translate(0, 140)">
      <!-- Pill 1 -->
      <rect class="pill-bg" x="0" y="0" width="165" height="36" />
      <text class="pill-text" x="18" y="23">🧥 Smart Layering</text>

      <!-- Pill 2 -->
      <rect class="pill-bg" x="180" y="0" width="180" height="36" />
      <text class="pill-text" x="18" y="23">⏰ 07:00 AM Alert</text>
    </g>

    <g transform="translate(0, 190)">
      <!-- Pill 3 -->
      <rect class="pill-bg" x="0" y="0" width="175" height="36" />
      <text class="pill-text" x="18" y="23">☔ Timed Rain Alerts</text>

      <!-- Pill 4 -->
      <rect class="pill-bg" x="190" y="0" width="170" height="36" />
      <text class="pill-text" x="18" y="23">🔒 100% Offline-First</text>
    </g>
  </g>
</svg>
